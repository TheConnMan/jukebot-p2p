name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag matches manifest version
        if: github.event_name == 'push'
        run: python3 scripts/check-version.py --match-tag "$GITHUB_REF_NAME"

      - name: Package
        run: scripts/package.sh

      - name: Upload zip
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: jukebot-p2p
          path: dist/*.zip

      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(mktemp)"
          awk -v ver="$version" '
            $0 == "## " ver {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > "$notes"
          # Drop a notes file that is only blank lines so gh can generate notes.
          if ! grep -q '[^[:space:]]' "$notes"; then
            : > "$notes"
          fi
          zip="dist/jukebot-p2p-${version}.zip"
          if [ -s "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Chrome Web Store status
        if: github.event_name == 'workflow_dispatch'
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: python3 scripts/cws.py status

      - name: Chrome Web Store submit
        if: github.event_name == 'push'
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/cws.py submit "dist/jukebot-p2p-${version}.zip"
